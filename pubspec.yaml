name: flutter_application_1
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.16
  file_picker: ^10.1.2
  metadata_god: ^1.0.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  marquee: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/default_art.png
    - assets/images/splash_icon.png
    - assets/images/app_icon.png
    - assets/images/MusicVerse_dark.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/MusicVerse_dark.png"
  min_sdk_android: 23
  adaptive_icon_background: "#1C2526" # Dark background color for adaptive icon
  adaptive_icon_foreground: "assets/images/MusicVerse_dark.png"

flutter_native_splash:
  color: "#1C2526" # Dark background color
  image: assets/images/MusicVerse_dark.png
  android: true
  ios: true
  android_12:
    image: assets/images/MusicVerse_dark.png
    color: "#1C2526"
  fullscreen: true